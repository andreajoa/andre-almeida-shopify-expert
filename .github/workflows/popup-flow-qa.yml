name: Popup Flow QA

on:
  pull_request:
    branches: [main]

jobs:
  popup-flow:
    if: github.head_ref == 'preview/final-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start app
        run: |
          npm start -- -p 3000 >/tmp/app.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/pt-BR >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/app.log
          exit 1
      - name: Verify popup subscribe flow
        run: |
          node <<'NODE'
          const base='http://127.0.0.1:3000';
          const sid='aa_qa_popup_'+Date.now();
          const email=`qa-popup-${Date.now()}@andre-almeida.online`;
          const res=await fetch(base+'/api/marketing/subscribe',{
            method:'POST',
            headers:{'content-type':'application/json','accept-language':'pt-BR,pt;q=0.9'},
            body:JSON.stringify({name:'QA Popup',email,consent:true,sessionId:sid,locale:'pt-BR',source:'qa',medium:'automation',campaign:'popup-fix',path:'/pt-BR',referrer:''})
          });
          const body=await res.json().catch(()=>({}));
          console.log('status',res.status,'body',JSON.stringify(body));
          if(!res.ok||body.ok!==true||!body.leadId) throw new Error('Popup subscribe flow failed');
          console.log('POPUP SUBSCRIBE PASS');
          NODE
