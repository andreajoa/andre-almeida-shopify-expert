name: Preview Live QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  live-qa:
    if: github.head_ref == 'preview/final-redesign' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://andre-almeida.online
      QA_NAME: QA Preview 20260822
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: HTTP, SEO, assets and contact API QA
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;
          const requiredRoutes = [
            '/pt-BR', '/pt-BR/services', '/pt-BR/portfolio', '/pt-BR/about', '/pt-BR/contact',
            '/pt-BR/websites-ecommerce', '/pt-BR/website-para-empresas', '/pt-BR/ecommerce-proprio',
            '/pt-BR/vender-livros-online', '/pt-BR/autoridade-online',
            '/en', '/en/services', '/en/portfolio', '/en/about', '/en/contact', '/en/websites-ecommerce'
          ];
          const assets = [
            '/brand/andre-premium.webp', '/brand/nova-ai.webp', '/brand/caa-neuro.webp',
            '/brand/amb-boutique.jpg', '/brand/brinqueteando.webp', '/favicon.svg'
          ];
          async function must200(path) {
            const res = await fetch(base + path, { redirect: 'follow' });
            if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
            return res;
          }
          for (const route of requiredRoutes) {
            const res = await must200(route);
            const text = await res.text();
            if (text.length < 1000) throw new Error(`${route} returned suspiciously short HTML`);
            if (/Vastara/i.test(text)) throw new Error(`${route} still contains Vastara`);
          }
          for (const asset of assets) {
            const res = await must200(asset);
            const ct = res.headers.get('content-type') || '';
            if (!ct.includes('image')) throw new Error(`${asset} is not served as an image (${ct})`);
          }
          const robots = await (await must200('/robots.txt')).text();
          if (!/sitemap/i.test(robots) || !/OAI-SearchBot|GPTBot|PerplexityBot|Google-Extended/i.test(robots)) {
            throw new Error('robots.txt is missing sitemap or AI crawler directives');
          }
          const sitemap = await (await must200('/sitemap.xml')).text();
          for (const must of ['/pt-BR/websites-ecommerce','/en/websites-ecommerce','/pt-BR/vender-livros-online']) {
            if (!sitemap.includes(must)) throw new Error(`sitemap.xml missing ${must}`);
          }
          const llms = await (await must200('/llms.txt')).text();
          if (!/e-commerce|ecommerce/i.test(llms) || !/website/i.test(llms)) throw new Error('llms.txt missing core service context');
          const lead = {
            name: process.env.QA_NAME,
            email: 'qa-preview@andre-almeida.online',
            phone: '+55 11 99999-0000',
            company: 'Preview QA',
            serviceType: 'Website / E-commerce',
            budget: 'QA',
            message: 'Teste automatizado do formulário do preview. Pode ignorar esta mensagem.',
            locale: 'pt-BR',
            type: 'contact'
          };
          const contactRes = await fetch(base + '/api/contact', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(lead)
          });
          const contactJson = await contactRes.json();
          if (!contactRes.ok || !contactJson.success) throw new Error(`Contact API failed: ${JSON.stringify(contactJson)}`);
          if (contactJson.warning) throw new Error(`Contact email warning: ${contactJson.warning}`);
          console.log('HTTP/SEO/assets/contact API QA passed', contactJson.id);
          NODE

      - name: Browser, responsive, images, language and WhatsApp QA
        run: |
          mkdir -p qa-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = process.env.BASE_URL;
          const expectedWhatsApp = '5511992598585';
          const pages = ['/pt-BR','/pt-BR/services','/pt-BR/portfolio','/pt-BR/about','/pt-BR/contact','/pt-BR/websites-ecommerce','/en'];
          const sizes = [
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'desktop-1440', width: 1440, height: 1000 }
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];
            for (const size of sizes) {
              const context = await browser.newContext({ viewport: { width: size.width, height: size.height } });
              for (const path of pages) {
                const page = await context.newPage();
                const consoleErrors = [];
                const failedRequests = [];
                page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
                page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} ${req.failure()?.errorText || ''}`));
                const response = await page.goto(base + path, { waitUntil: 'networkidle', timeout: 60000 });
                if (!response || response.status() >= 400) failures.push(`${size.name} ${path}: HTTP ${response?.status()}`);
                const brokenImages = await page.locator('img').evaluateAll(imgs => imgs.filter(img => !img.complete || img.naturalWidth === 0).map(img => img.getAttribute('src')));
                if (brokenImages.length) failures.push(`${size.name} ${path}: broken images ${brokenImages.join(', ')}`);
                const purpleCount = await page.locator('[class*="purple"], [class*="violet"], [class*="indigo"]').count();
                if (path !== '/pt-BR' && purpleCount > 20) failures.push(`${size.name} ${path}: excessive legacy purple classes (${purpleCount})`);
                if (consoleErrors.length) failures.push(`${size.name} ${path}: console errors ${consoleErrors.join(' | ')}`);
                if (failedRequests.length) failures.push(`${size.name} ${path}: failed requests ${failedRequests.join(' | ')}`);
                const file = `qa-screenshots/${size.name}-${path.replaceAll('/','_') || 'root'}.png`;
                await page.screenshot({ path: file, fullPage: true });
                await page.close();
              }
              await context.close();
            }
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            await page.goto(base + '/pt-BR', { waitUntil: 'networkidle', timeout: 60000 });
            const whatsappHrefs = await page.locator('a[href*="wa.me"]').evaluateAll(as => as.map(a => a.href));
            if (!whatsappHrefs.length || whatsappHrefs.some(href => !href.includes(expectedWhatsApp))) {
              failures.push(`WhatsApp href mismatch: ${JSON.stringify(whatsappHrefs)}`);
            }
            const langButton = page.getByRole('button', { name: /Traduzir website para inglês/i }).first();
            if (await langButton.count()) {
              await langButton.click();
              await page.waitForURL(/\/en(\/|$)/, { timeout: 30000 });
            } else {
              failures.push('PT→EN translation button not found');
            }
            await context.close();
            await browser.close();
            fs.writeFileSync('qa-screenshots/qa-result.json', JSON.stringify({ failures }, null, 2));
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
            console.log('Browser/responsive/images/language/WhatsApp QA passed');
          })();
          NODE

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-live-qa-screenshots
          path: qa-screenshots
          if-no-files-found: warn
          retention-days: 7
