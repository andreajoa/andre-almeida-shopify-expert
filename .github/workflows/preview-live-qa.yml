name: Preview Live QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  live-qa:
    if: github.head_ref == 'preview/final-redesign' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install lint and build exact preview
        run: |
          npm ci
          npm run lint
          npm run build
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start -- -p 3000 > /tmp/andre-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/pt-BR >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/andre-preview.log
          exit 1
      - name: HTTP SEO assets routes and API QA
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const routes=['/pt-BR','/pt-BR/services','/pt-BR/portfolio','/pt-BR/about','/pt-BR/contact','/pt-BR/websites-ecommerce','/pt-BR/website-para-empresas','/pt-BR/ecommerce-proprio','/pt-BR/vender-livros-online','/pt-BR/autoridade-online','/en','/en/services','/en/portfolio','/en/about','/en/contact','/en/websites-ecommerce'];
          const assets=['/images/andre6.png','/brand/nova-ai.webp','/brand/caa-neuro.webp','/brand/amb-boutique.jpg','/brand/brinqueteando.webp','/favicon.svg'];
          async function get(p){const r=await fetch(base+p,{redirect:'follow'});if(!r.ok)throw new Error(`${p} HTTP ${r.status}`);return r}
          for(const p of routes){const h=await(await get(p)).text();if(h.length<1000)throw new Error(`${p} short HTML`);if(/Vastara/i.test(h))throw new Error(`${p} Vastara residual`)}
          for(const p of assets){const r=await get(p);const b=Buffer.from(await r.arrayBuffer());let ok=false;if(p.endsWith('.webp'))ok=b.length>12&&b.toString('ascii',0,4)==='RIFF'&&b.toString('ascii',8,12)==='WEBP';else if(/\.jpe?g$/.test(p))ok=b.length>3&&b[0]===0xff&&b[1]===0xd8&&b[2]===0xff;else if(p.endsWith('.png'))ok=b.length>8&&b[0]===0x89&&b.toString('ascii',1,4)==='PNG';else if(p.endsWith('.svg'))ok=b.toString('utf8').includes('<svg');if(!ok)throw new Error(`${p} invalid binary`)}
          const robots=await(await get('/robots.txt')).text();if(!/sitemap/i.test(robots)||!/OAI-SearchBot|GPTBot|PerplexityBot|Google-Extended/i.test(robots))throw new Error('robots incomplete');
          const sitemap=await(await get('/sitemap.xml')).text();for(const x of ['/pt-BR/websites-ecommerce','/en/websites-ecommerce','/pt-BR/vender-livros-online'])if(!sitemap.includes(x))throw new Error(`sitemap missing ${x}`);
          const llms=await(await get('/llms.txt')).text();if(!/e-commerce|ecommerce/i.test(llms)||!/website/i.test(llms))throw new Error('llms incomplete');
          const nf=await fetch(base+'/pt-BR/__qa-not-found__');if(nf.status!==404)throw new Error(`404 route returned ${nf.status}`);
          const res=await fetch(base+'/api/contact',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'QA Local Preview',email:'qa-preview@andre-almeida.online',phone:'+55 11 99999-0000',company:'Preview QA',serviceType:'Website / E-commerce',budget:'QA',locale:'pt-BR',type:'contact',message:'Teste automatizado local do formulário.'})});const j=await res.json();if(!res.ok||!j.success)throw new Error(`contact API failed ${JSON.stringify(j)}`);
          console.log('HTTP/SEO/assets/routes/API PASS');
          NODE
      - name: Browser responsive images language WhatsApp and visual QA
        run: |
          mkdir -p qa-screenshots
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');const base=process.env.BASE_URL;
          const pages=['/pt-BR','/pt-BR/services','/pt-BR/portfolio','/pt-BR/about','/pt-BR/contact','/pt-BR/websites-ecommerce','/en'];
          const sizes=[{n:'390',w:390,h:844},{n:'768',w:768,h:1024},{n:'1024',w:1024,h:900},{n:'1440',w:1440,h:1000}];
          const scrollAll=async page=>{await page.evaluate(async()=>{const step=600;for(let y=0;y<document.documentElement.scrollHeight;y+=step){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,35))}window.scrollTo(0,0)});await page.waitForTimeout(300)};
          (async()=>{const browser=await chromium.launch({headless:true}),fail=[];for(const s of sizes){const c=await browser.newContext({viewport:{width:s.w,height:s.h}});for(const p of pages){const page=await c.newPage(),ce=[],rf=[];page.on('console',m=>{if(m.type()==='error'&&!/google-analytics|ERR_ABORTED/i.test(m.text()))ce.push(m.text())});page.on('requestfailed',r=>{const e=r.failure()?.errorText||'';if(!/ERR_ABORTED/.test(e)&&!/google-analytics\.com/.test(r.url()))rf.push(`${r.url()} ${e}`)});const r=await page.goto(base+p,{waitUntil:'networkidle',timeout:60000});if(!r||r.status()>=400)fail.push(`${s.n} ${p} HTTP ${r?.status()}`);await scrollAll(page);const bi=await page.locator('img').evaluateAll(a=>a.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src));if(bi.length)fail.push(`${s.n} ${p} broken ${bi.join(',')}`);const sw=await page.evaluate(()=>document.documentElement.scrollWidth);if(sw>s.w+2)fail.push(`${s.n} ${p} horizontal overflow ${sw}`);if(ce.length)fail.push(`${s.n} ${p} console ${ce.join('|')}`);if(rf.length)fail.push(`${s.n} ${p} requests ${rf.join('|')}`);await page.screenshot({path:`qa-screenshots/${s.n}-${p.replaceAll('/','_')}.png`,fullPage:true});await page.close()}await c.close()}
          const c=await browser.newContext({viewport:{width:1440,height:1000}}),page=await c.newPage();await page.goto(base+'/pt-BR',{waitUntil:'networkidle',timeout:60000});const wa=await page.locator('a[href*="wa.me"]').evaluateAll(a=>a.map(x=>x.href));if(!wa.length||wa.some(h=>!h.includes('5511992598585')))fail.push(`WhatsApp ${JSON.stringify(wa)}`);const lb=page.getByRole('button',{name:/Traduzir website para inglês/i}).first();if(!await lb.count())fail.push('PT EN button missing');else{await lb.click();await page.waitForURL(/\/en(\/|$)/,{timeout:30000})}await c.close();await browser.close();fs.writeFileSync('qa-screenshots/qa-result.json',JSON.stringify({fail},null,2));if(fail.length){console.error(fail.join('\n'));process.exit(1)}console.log('Browser/responsive/images/language/WhatsApp PASS')})();
          NODE
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-live-qa-screenshots
          path: qa-screenshots
          retention-days: 7
