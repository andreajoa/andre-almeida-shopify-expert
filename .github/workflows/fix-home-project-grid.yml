name: Fix Home Project Grid

on:
  push:
    branches: [preview/final-redesign]
    paths:
      - '.github/workflows/fix-home-project-grid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/final-redesign
          fetch-depth: 0
      - name: Make all four home cases permanently visible and frame commerce screenshots
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/components/home/PremiumHome.tsx')
          s=p.read_text()
          start=s.index('            {selectedProjects.map((project, index) => <AnimatedSection')
          end=s.index('\n          </div>', start)
          replacement='''            {selectedProjects.map((project, index) => {
              const isCommerce = project.title === "AMB Boutique" || project.title === "Brinqueteando"
              return (
                <div key={project.title} className={project.featured ? "lg:col-span-7" : index === 1 ? "lg:col-span-5" : "lg:col-span-6"}>
                  <a href={project.href} target="_blank" rel="noopener noreferrer" onClick={() => Analytics.ctaClick(`premium_project_${project.title}`)} className="group block h-full border-t border-[#cfc8bc] pt-4">
                    {isCommerce ? (
                      <div className="overflow-hidden rounded-[18px] border border-[#cfc8bc] bg-[#f7f4ed] shadow-[0_18px_55px_rgba(17,17,15,0.08)] transition duration-500 group-hover:-translate-y-1 group-hover:shadow-[0_24px_70px_rgba(17,17,15,0.12)]">
                        <div className="flex h-9 items-center gap-1.5 border-b border-[#d8d2c7] bg-[#f2efe8] px-4" aria-hidden="true">
                          <span className="h-1.5 w-1.5 rounded-full bg-[#9b9589]" />
                          <span className="h-1.5 w-1.5 rounded-full bg-[#b8b1a4]" />
                          <span className="h-1.5 w-1.5 rounded-full bg-[#c9c2b5]" />
                        </div>
                        <div className="aspect-[16/9] bg-[#f7f4ed] p-3 sm:p-4">
                          <div className="relative h-full w-full overflow-hidden">
                            <Image src={project.image} alt={`Projeto ${project.title}`} fill loading="eager" className="object-contain object-center transition duration-700 ease-out group-hover:scale-[1.012]" sizes="(max-width: 1024px) 100vw, 50vw" />
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className={`relative overflow-hidden bg-[#dad4c9] ${project.featured ? "aspect-[1.16/1]" : "aspect-[1.1/1]"}`}>
                        <Image src={project.image} alt={`Projeto ${project.title}`} fill loading="eager" className="object-cover transition duration-700 ease-out group-hover:scale-[1.025]" sizes={project.featured ? "(max-width: 1024px) 100vw, 58vw" : "(max-width: 1024px) 100vw, 42vw"}/>
                        <div className="absolute inset-0 bg-gradient-to-t from-black/25 via-transparent to-transparent" />
                      </div>
                    )}
                    <div className="grid grid-cols-[1fr_auto] gap-5 py-5 sm:py-6">
                      <div><p className="text-[9px] font-semibold tracking-[0.16em] text-[#807b71]">{project.category}</p><h3 className="mt-3 font-editorial text-3xl leading-none tracking-[-0.03em] sm:text-4xl">{project.title}</h3><p className="mt-3 max-w-xl text-sm leading-6 text-[#6c675e]">{project.description}</p></div>
                      <div className="text-right"><span className="text-[10px] font-semibold tracking-[0.15em] text-[#807b71]">{project.index}</span><span className="mt-8 hidden items-center gap-2 text-[9px] font-semibold uppercase tracking-[0.14em] sm:flex">{c.viewProject}<ArrowUpRight className="h-3.5 w-3.5" /></span></div>
                    </div>
                  </a>
                </div>
              )
            })}'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          grep -q 'const isCommerce' src/components/home/PremiumHome.tsx
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'andreajoa'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git add src/components/home/PremiumHome.tsx
          git rm .github/workflows/fix-home-project-grid.yml
          git commit -m 'fix: show all four home cases with premium commerce frames'
          git push origin HEAD:preview/final-redesign
