name: One-time Refresh Scheduled Nurture

on:
  push:
    branches:
      - preview/final-redesign

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace legacy scheduled emails
        env:
          DASHBOARD_SESSION: rfndil_HbY2wGf1noZNpYUgR98djuHViMeMWjLNrYBq93vwECHkgRjUslEBHWOrt
        run: |
          set -euo pipefail
          URL="https://andre-almeida-git-previ-e16ed2-andre-almeidas-projects-7fa48c22.vercel.app/api/dashboard"
          BODY='{"action":"replace_scheduled_nurture","leadId":"e742b577-60f9-4ba1-b77d-76bb63a3e9ae"}'
          HTTP_CODE=$(curl -sS -o /tmp/refresh-response.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "Cookie: aa_dashboard_session=${DASHBOARD_SESSION}" \
            --data "$BODY")
          cat /tmp/refresh-response.json
          echo
          echo "HTTP ${HTTP_CODE}"
          test "$HTTP_CODE" = "200"
